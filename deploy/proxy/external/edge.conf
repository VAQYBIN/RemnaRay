# Section 21.7: the `external` profile publishes one upstream on
# 127.0.0.1:${RR_EXTERNAL_HTTP_PORT}, so the owner's proxy sees a single
# address instead of having to route between `api` and `web` itself.
#
# Deliberately minimal: no TLS, no rate limits, no security headers. Those are
# the external proxy's job, and duplicating them here would mean two places to
# change and two chances to disagree.

user  nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65s;
    client_max_body_size 10m;
    access_log /dev/stdout;

    upstream rr_web { server web:3001; keepalive 32; }
    upstream rr_api { server api:3000; keepalive 32; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

        proxy_http_version 1.1;
        # The external proxy's values are passed through untouched; the API
        # decides what to believe from `RR_TRUSTED_PROXIES`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 60s;
        proxy_redirect off;

        location ^~ /api/     { proxy_pass http://rr_api; }
        location ^~ /webhooks/ { proxy_pass http://rr_api; }
        location ^~ /tg/      { proxy_pass http://rr_api; }
        location ^~ /metrics  { proxy_pass http://rr_api; }
        location /            { proxy_pass http://rr_web; }
    }
}
