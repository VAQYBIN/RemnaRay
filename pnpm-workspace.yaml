packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.0'
  - '@turbo/darwin-arm64@2.11.0'
  - '@turbo/linux-64@2.11.0'
  - '@turbo/linux-arm64@2.11.0'
  - '@turbo/windows-64@2.11.0'
  - '@turbo/windows-arm64@2.11.0'
  - turbo@2.11.0
  - '@types/node@24.13.6'
  - intl-messageformat@12.1.1
