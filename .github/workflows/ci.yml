name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Repository tests
        run: pnpm test

      - name: Package tests
        run: |
          pnpm --filter @remnaray/config test
          pnpm --filter @remnaray/logger test
          pnpm --filter @remnaray/money test
          pnpm --filter @remnaray/db test

      - name: Build
        run: pnpm build

  docker:
    name: docker / ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: remnaray/${{ matrix.image }}:ci
