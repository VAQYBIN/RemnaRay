# Section 24.6. The application does not change; its base images do. Every
# Monday the five images are rebuilt on whatever `node:24-alpine`,
# `nginx:1.30-alpine`, `caddy:2-alpine` and `postgres:18-alpine` currently are,
# published as `X.Y.Z-<yyyymmdd>`, and the floating `X.Y` and `X` tags are
# moved onto them when the version is the newest of their line.
# The changelog does not change: nothing about the application did.
name: rebuild

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: The released version to rebuild (for example 1.2.3).
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  rebuild:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          # `compose.yaml` pulls this one in every profile, so a rebuild that
          # leaves it behind leaves it on an ageing base.
          - image: backup
            file: deploy/backup/Dockerfile
    steps:
      - name: Find the latest release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const asked = context.payload.inputs?.version;
            if (asked) return asked;
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            return data.tag_name.replace(/^v/u, '');
          result-encoding: string

      # Decided on the default branch, which carries the script and every
      # release tag: a manual rebuild of an older version must not move
      # `X.Y` or `X` back onto it.
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide the floating tags
        id: floating
        run: scripts/floating-tags.sh '${{ steps.release.outputs.result }}' >> "$GITHUB_OUTPUT"

      - name: Checkout that release
        uses: actions/checkout@v7
        with:
          ref: v${{ steps.release.outputs.result }}

      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build it again, from scratch
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: RR_APP_VERSION=${{ steps.release.outputs.result }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:${{ steps.release.outputs.result }}-${{ github.run_id }}

      - name: Scan the rebuilt image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:${{ steps.release.outputs.result }}-${{ github.run_id }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Only once the scan is clean: a rebuild that made things worse must not
      # become what `RR_VERSION=1` resolves to.
      - name: Publish the dated and floating tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ steps.release.outputs.result }}
          MOVE_MINOR: ${{ steps.floating.outputs.minor }}
          MOVE_MAJOR: ${{ steps.floating.outputs.major }}
        run: |
          tags="${VERSION}-$(date -u '+%Y%m%d')"
          if [ "$MOVE_MINOR" = true ]; then tags="$tags ${VERSION%.*}"; fi
          if [ "$MOVE_MAJOR" = true ]; then tags="$tags ${VERSION%%.*}"; fi
          source="${IMAGE}:${VERSION}-${{ github.run_id }}"
          for tag in $tags; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "$source"
          done

      - name: Attest the provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
