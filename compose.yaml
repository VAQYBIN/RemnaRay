name: remnaray

x-app-common: &app-common
  image: ${RR_APP_IMAGE:-ghcr.io/remnaray/app:local}
  env_file: .env
  environment:
    TZ: UTC
    RR_THEMES_DIR: /themes
    RR_LOCALES_DIR: /locales
    RR_API_URL: http://api:3000
    DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-remnaray}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-remnaray}}
    VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
  networks: [rr_net]
  restart: unless-stopped
  volumes:
    - ./themes:/themes:ro
    - ./locales:/locales:ro
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remnaray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-remnaray}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [rr_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-remnaray} -d ${POSTGRES_DB:-remnaray}']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1-alpine
    command:
      [
        valkey-server,
        --save,
        '60',
        '1000',
        --appendonly,
        yes,
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes: [valkeydata:/data]
    networks: [rr_net]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app-common
    command: [node, dist/apps/api/main.js]
    expose: ['3000']
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/v1/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6

  bot:
    <<: *app-common
    command: [node, dist/apps/bot/main.js]
    expose: ['3002']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health]
      interval: 15s
      timeout: 5s
      retries: 4

  worker:
    <<: *app-common
    command: [node, dist/apps/worker/main.js]
    expose: ['3003']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3003/health]
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    image: ${RR_WEB_IMAGE:-ghcr.io/remnaray/web:local}
    environment:
      INTERNAL_API_URL: http://api:3000
      RR_THEMES_DIR: /themes
      RR_LOCALES_DIR: /locales
      RR_DOMAIN: ${RR_DOMAIN}
      TZ: UTC
      PORT: 3001
    networks: [rr_net]
    expose: ['3001']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    volumes:
      - ./themes:/themes:ro
      - ./locales:/locales:ro

  # --- proxy (section 21.1). `external` starts none of these. ---
  proxy-config:
    <<: *app-common
    command:
      [
        node,
        dist/tools/render-proxy.js,
        --profile,
        '${RR_PROXY_PROFILE:-nginx}',
        --tls,
        '${RR_TLS_MODE:-acme}',
        --watch,
      ]
    read_only: false
    volumes:
      - proxy-conf:/proxy-conf
      - ./deploy/proxy:/templates:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    profiles: [nginx, caddy]

  proxy-nginx:
    image: ${RR_NGINX_IMAGE:-ghcr.io/remnaray/nginx:local}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - proxy-conf:/etc/nginx/conf.d:ro
      - proxy-acme:/var/cache/nginx/acme
      - proxy-cache:/var/cache/nginx/proxy
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - ./deploy/proxy/certs:/etc/nginx/certs:ro
    networks: { rr_net: { ipv4_address: 172.28.0.10 } }
    depends_on:
      proxy-config: { condition: service_started }
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [nginx]

  # Only with RR_TLS_MODE=certbot; `./rr up` adds the profile automatically.
  certbot:
    image: certbot/certbot:latest
    entrypoint:
      - /bin/sh
      - -c
      - >
        trap exit TERM;
        while :; do
        certbot renew --webroot -w /var/www/certbot
        --deploy-hook 'touch /etc/letsencrypt/.renewed';
        sleep 12h & wait $${!};
        done
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks: [rr_net]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [certbot]

  proxy-caddy:
    image: ${RR_CADDY_IMAGE:-ghcr.io/remnaray/caddy:local}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - proxy-conf:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      # Not inside /etc/caddy: that path is the read-only `proxy-conf` volume.
      - ./deploy/proxy/certs:/certs:ro
    networks: { rr_net: { ipv4_address: 172.28.0.10 } }
    depends_on:
      proxy-config: { condition: service_started }
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [caddy]

  # The only container with the docker socket, and it is read-only.
  proxy-reloader:
    <<: *app-common
    command: [node, dist/tools/proxy-reloader.js, --profile, '${RR_PROXY_PROFILE:-nginx}']
    read_only: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-conf:/proxy-conf:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      valkey: { condition: service_healthy }
    profiles: [nginx, caddy]

networks:
  rr_net:
    ipam: { config: [{ subnet: 172.28.0.0/16 }] }

volumes:
  pgdata: {}
  valkeydata: {}
  proxy-conf: {}
  proxy-acme: {}
  proxy-cache: {}
  certbot-webroot: {}
  certbot-certs: {}
  caddy-data: {}
  caddy-config: {}
